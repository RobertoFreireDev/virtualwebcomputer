function highlight(code, lang){
  const t = esc(code);
  const def = LANGS[lang];
  if(!def || !def.re) return t;
  def.re.lastIndex = 0;
  return t.replace(def.re, (...a) => {
    const g = a[a.length - 1];
    for(const k in g) if(g[k] !== undefined) return `<span class="t-${k}">${g[k]}</span>`;
    return a[0];
  });
}

/* ═══════════════════════════ code formatting ═══════════════════════════ */
/* Every language gets a fmt(code) → string, run by the Format button in the block header
   while editing. They are small pretty-printers, not parsers: strings and comments are
   copied through, the rest is re-broken into lines and re-indented. Throw to refuse. */
const SP = n => " ".repeat(n);
const lf = s => s.replace(/\r\n?/g, "\n");
/* joins finished lines: at most one blank line in a row, none at the end */
const joinLines = lines => lines.join("\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+|\s+$/g, "");

/* C-like syntaxes (C#, JavaScript, CSS): `{` `;` end a line, `}` starts one, indentation
   follows the unclosed brackets. Inside ( ) and [ ] nothing is re-broken, so calls, `for(;;)`
   heads and object/array literals passed as arguments keep their shape. */
function fmtClike(code, unit, lineComment){
  code = lf(code);
  const n = code.length, lines = [];
  let cur = "", depth = 0, start = 0, inl = 0, i = 0;
  const flush = () => {
    const t = cur.trim(); cur = "";
    if(t){ let ind = start; if(/^[}\])]/.test(t)) ind = Math.max(0, ind - 1); lines.push(SP(ind * unit) + t); }
    else lines.push("");
    start = depth;
  };
  /* end the line here unless the source already does */
  const nl = () => { while(code[i] === " " || code[i] === "\t") i++; if(code[i] !== "\n") flush(); };
  while(i < n){
    const c = code[i], d = code[i + 1];
    if(c === "\n"){ flush(); i++; continue; }
    if(lineComment && code.startsWith(lineComment, i)){ let j = code.indexOf("\n", i); if(j < 0) j = n; cur += code.slice(i, j); i = j; continue; }
    if(c === "/" && d === "*"){ let j = code.indexOf("*/", i + 2); j = j < 0 ? n : j + 2; cur += code.slice(i, j); i = j; continue; }
    if(c === '"' || c === "'" || c === "`"){
      let j = i + 1;
      while(j < n && code[j] !== c && (c === "`" || code[j] !== "\n")){ if(code[j] === "\\") j++; j++; }
      if(j < n && code[j] === c) j++;
      cur += code.slice(i, j); i = j; continue;
    }
    if(c === "(" || c === "["){ depth++; inl++; cur += c; i++; continue; }
    if(c === ")" || c === "]"){ depth = Math.max(0, depth - 1); inl = Math.max(0, inl - 1); cur += c; i++; continue; }
    if(c === "{"){ depth++; cur += c; i++; if(!inl) nl(); continue; }
    if(c === "}"){
      if(!inl && cur.trim()) flush();
      depth = Math.max(0, depth - 1); cur += c; i++;
      if(!inl){
        while(code[i] === " " || code[i] === "\t") i++;
        const rest = code.slice(i, i + 8);
        if(/^(else|catch|finally|while)\b/.test(rest)) cur += " ";    // keep "} else {" together
        else if(!/^[;,)\].]/.test(rest)) nl();
      }
      continue;
    }
    if(c === ";"){ cur += c; i++; if(!inl) nl(); continue; }
    cur += c; i++;
  }
  flush();
  return joinLines(lines);
}
/* JSON: invalid text is retried once as the body of a JSON string literal, so escaped
   JSON copied out of a log or source code ({\"a\":1}) is unescaped and formatted. */
function fmtJson(code){
  let v;
  try{ v = JSON.parse(code); }
  catch(e){
    try{ v = JSON.parse(JSON.parse('"' + code.trim().replace(/\r?\n/g, "\\n").replace(/\t/g, "\\t") + '"')); }
    catch(e2){ throw new Error("not valid JSON"); }
  }
  return JSON.stringify(v, null, 2);
}
/* SQL: keywords upper-cased, one clause per line, AND/OR indented under their clause,
   sub-queries indented by their parentheses. Column lists stay on the clause line. */
const SQL_WORDS = new Set([...LANGS.sql.re.source.matchAll(/\(\?<(?:keyword|fn)>\\b\(\?:([a-z_|]+)\)/g)].flatMap(m => m[1].split("|")));
const SQL_CLAUSE = /^(select|from|where|group|order|having|limit|union|except|intersect|insert|values|update|set|delete|join|left|right|inner|full|cross|outer|and|or|with)$/;
const SQL_MOD = /^(left|right|inner|full|cross|outer|union|group|order|insert|delete|natural)$/;   // "LEFT JOIN", "ORDER BY" …
function fmtSql(code){
  /* paren[d] = { ind: indent of the line that opened the parenthesis at depth d, own: it holds a clause } */
  const unit = 2, lines = [], paren = [{ ind:-1, own:true }];
  let line = "", ind = 0, pend = false, prev = "", betw = false, comment = false;
  const nl = i => { if(line.trim()) lines.push(line.replace(/\s+$/, "")); ind = i; line = SP(ind * unit); pend = false; comment = false; };
  const add = (t, tight) => {
    if(comment) nl(ind);
    if(pend && !tight && line && !/\s$/.test(line)) line += " ";
    line += t; pend = false;
  };
  for(const m of lf(code).matchAll(/--[^\n]*|\/\*[\s\S]*?\*\/|'(?:[^']|'')*'|"[^"]*"|\[[^\]]*\]|\s+|[A-Za-z_]\w*|./g)){
    const t = m[0];
    if(/^\s+$/.test(t)){ pend = true; continue; }
    if(t.startsWith("--")){ add(t); comment = true; continue; }
    if(t === "("){ add("("); paren.push({ ind, own:false }); pend = false; continue; }
    if(t === ")"){ const p = paren.length > 1 ? paren.pop() : paren[0]; if(p.own && p.ind >= 0) nl(p.ind); add(")", true); continue; }
    if(t === ","){ add(",", true); continue; }
    if(t === ";"){ add(";", true); nl(0); lines.push(""); prev = ""; continue; }
    if(/^[A-Za-z_]/.test(t)){
      const w = t.toLowerCase(), word = SQL_WORDS.has(w) ? t.toUpperCase() : t;
      if(SQL_CLAUSE.test(w) && !SQL_MOD.test(prev)){
        const p = paren[paren.length - 1], base = p.ind + 1;
        if(w === "and" || w === "or"){ if(betw) betw = false; else nl(base + 1); }
        else nl(base);
        p.own = true;
      }
      add(word);
      if(w === "between") betw = true;
      prev = w; continue;
    }
    add(t);
  }
  nl(0);
  return joinLines(lines);
}
/* HTML: one block tag per line, children indented; text and inline tags (<b>, <a> …) share a
   line; script/style/pre/textarea contents are kept verbatim */
const VOID_TAGS = /^(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr|!doctype)$/;
const INLINE_TAGS = /^(a|abbr|b|code|em|i|kbd|mark|q|s|small|span|strike|strong|sub|sup|u)$/;
function fmtHtml(code){
  code = lf(code);
  const n = code.length, lower = code.toLowerCase(), lines = [];
  let ind = 0, i = 0, text = "";
  const push = t => lines.push(SP(ind * 2) + t);
  const flush = () => { const t = text.replace(/\s+/g, " ").trim(); if(t) push(t); text = ""; };
  while(i < n){
    if(code[i] !== "<"){ let j = code.indexOf("<", i); if(j < 0) j = n; text += code.slice(i, j); i = j; continue; }
    if(code.startsWith("<!--", i)){ flush(); let j = code.indexOf("-->", i); j = j < 0 ? n : j + 3; push(code.slice(i, j).trim()); i = j; continue; }
    let j = code.indexOf(">", i); j = j < 0 ? n : j + 1;
    const tag = code.slice(i, j), m = /^<(\/?)([A-Za-z!][\w-]*)/.exec(tag);
    if(!m){ text += tag; i = j; continue; }
    const name = m[2].toLowerCase();
    if(INLINE_TAGS.test(name)){ text += tag; i = j; continue; }
    flush();
    if(m[1]){ ind = Math.max(0, ind - 1); push(tag); i = j; continue; }
    if(/^(script|style|pre|textarea)$/.test(name)){
      const e = lower.indexOf("</" + name, j);
      if(e >= 0){ let k = code.indexOf(">", e); k = k < 0 ? n : k + 1; push(code.slice(i, k)); i = k; continue; }
    }
    push(tag); i = j;
    if(!VOID_TAGS.test(name) && !/\/>$/.test(tag)) ind++;
  }
  flush();
  return joinLines(lines);
}
/* Python: indentation is meaning, so only its width is normalised — every level becomes 4 spaces */
function fmtPython(code){
  const stack = [0];
  return joinLines(lf(code).replace(/\t/g, SP(4)).split("\n").map(l => {
    const t = l.trim(); if(!t) return "";
    const lead = /^ */.exec(l)[0].length;
    while(lead < stack[stack.length - 1]) stack.pop();
    if(lead > stack[stack.length - 1]) stack.push(lead);
    return SP((stack.length - 1) * 4) + t;
  }));
}
/* Shell: blocks opened by then/do/else/in/{/( and closed by fi/done/esac/}/) */
function fmtBash(code){
  let level = 0;
  return joinLines(lf(code).split("\n").map(l => {
    const t = l.trim(); if(!t) return "";
    const s = t.replace(/\s#.*$/, "");                           // ignore a trailing comment
    if(/^(fi|done|esac|else|elif)\b|^[})]/.test(s)) level = Math.max(0, level - 1);
    const out = SP(level * 2) + t;
    if(/(\b(then|do|else|in)|[{(])\s*$/.test(s) || /^else\b/.test(s)) level++;
    return out;
  }));
}
function fmtPlain(code){
  return joinLines(lf(code).replace(/\t/g, SP(4)).split("\n").map(l => l.replace(/\s+$/, "")));
}
LANGS.plain.fmt      = fmtPlain;
LANGS.csharp.fmt     = c => fmtClike(c, 4, "//");
LANGS.javascript.fmt = c => fmtClike(c, 2, "//");
LANGS.css.fmt        = c => fmtClike(c, 2, null);
LANGS.json.fmt       = fmtJson;
LANGS.sql.fmt        = fmtSql;
LANGS.html.fmt       = fmtHtml;
LANGS.python.fmt     = fmtPython;
LANGS.bash.fmt       = fmtBash;
LANGS.diagram.fmt    = fmtDiagram;
/* the text of a block as the user sees it (pasted code may contain <br>) */
function preText(pre){
  const c = pre.cloneNode(true);
  c.querySelectorAll("br").forEach(b => b.replaceWith("\n"));
  return c.textContent.replace(/​/g, "");
}

/* ═══════════════════════════ diagrams ═══════════════════════════ */
/* The "diagram" language: ASCII / Unicode art from ChatGPT or Claude drawn as a picture in
   view mode. The page only ever stores <pre class="code" data-lang="diagram">text</pre>; the
   drawing is built in the viewer DOM (like the collapsed state) and never reaches `raw`.
   Pipeline: dgNormalize → dgGrid (one cell per character column) → dgKind picks a renderer:
   tree / outline → dgTree + dgTreeEl, table → mdCells + mdTableHtml, grid → dgScan (which
   cells are lines, in context) → dgModel (segments, boxes, heads, text runs) → dgSvg.
   Every coordinate comes from the grid, nothing is measured. */
const DG_CW = 8, DG_CH = 17;                  // one cell in viewBox units
const DG_ZERO = /^[\p{M}‍︀-️\u{1F3FB}-\u{1F3FF}]$/u;
const DG_WIDE = /^[\p{Emoji_Presentation}ᄀ-ᅟ⺀-〾ぁ-㏿㐀-䶿一-鿿ꀀ-꓏가-힣豈-﫿︰-﹏＀-｠￠-￦\u{20000}-\u{3FFFD}]$/u;
/* display width of one code point: CJK / emoji 2, combining marks and joiners 0 */
function dgWidth(ch){ return DG_ZERO.test(ch) ? 0 : DG_WIDE.test(ch) ? 2 : 1; }
/* lines ready for gridding; also the whole of the Format button. Relative columns never change. */
function dgNormalize(text){
  const lines = lf(String(text)).replace(/^﻿/, "").replace(/​/g, "").replace(/　/g, "  ")
    .replace(/[   -   ]/g, " ").split("\n").map(l => {
      let out = "", col = 0;
      for(const ch of l){
        if(ch === "\t"){ const n = 4 - col % 4; out += SP(n); col += n; }   // tab stops every 4 columns
        else{ out += ch; col += dgWidth(ch); }
      }
      return out.replace(/\s+$/, "");
    });
  while(lines.length && !lines[0]) lines.shift();
  while(lines.length && !lines[lines.length - 1]) lines.pop();
  const ind = Math.min(...lines.filter(l => l).map(l => /^ */.exec(l)[0].length));
  return ind > 0 && ind !== Infinity ? lines.map(l => l.slice(ind)) : lines;
}
function fmtDiagram(code){
  const lines = dgNormalize(code);
  if(!lines.length) throw new Error("empty diagram");
  return lines.join("\n");
}
/* cells[r][c] holds one character; a wide one is followed by a "" continuation cell and
   zero-width marks are folded into the cell before them. at() is " " outside the text. */
function dgGrid(lines){
  const cells = lines.map(l => {
    const row = [];
    for(const ch of l){
      const w = dgWidth(ch);
      if(!w){ let k = row.length - 1; while(k > 0 && row[k] === "") k--; if(k >= 0) row[k] += ch; continue; }
      row.push(ch); if(w === 2) row.push("");
    }
    return row;
  });
  const cols = cells.reduce((m, r) => Math.max(m, r.length), 0);
  return { rows:cells.length, cols, cells, at:(r, c) => { const v = cells[r] && cells[r][c]; return v === undefined ? " " : v; } };
}

/* Unicode glyphs are always lines. Directions: n e s w (+ ne se sw nw), "ne+sw" when a
   diagonal is involved; hs / vs = style of the horizontal / vertical strokes. */
const DG_GLYPH = {};
function dgDef(chars, dirs, hs, vs = hs, more = {}){
  const d = dirs.split(" ");
  [...chars].forEach((ch, i) => {
    const s = d[Math.min(i, d.length - 1)];
    DG_GLYPH[ch] = { dirs:s.includes("+") ? s.split("+") : [...s], hs, vs, ...more };
  });
}
const DG_BOX = "ew ns es sw ne nw nes nsw esw new nesw";
dgDef("─│┌┐└┘├┤┬┴┼╴╵╶╷", DG_BOX + " w n e s", "solid");
dgDef("━┃┏┓┗┛┣┫┳┻╋", DG_BOX, "heavy");
dgDef("═║╔╗╚╝╠╣╦╩╬", DG_BOX, "double");
dgDef("╒╕╘╛╞╡╤╧╪", "es sw ne nw nes nsw esw new nesw", "double", "solid");
dgDef("╓╖╙╜╟╢╥╨╫", "es sw ne nw nes nsw esw new nesw", "solid", "double");
dgDef("╭╮╯╰", "es sw nw ne", "solid", "solid", { round:true });
dgDef("┄┅┈┉╌╍", "ew", "dashed");
dgDef("┆┇┊┋╎╏", "ns", "dashed");
dgDef("╱╲╳", "ne+sw nw+se ne+sw+nw+se", "solid");
dgDef("→⟶➜➔➞", "w", "solid", "solid", { heads:["e"] });
dgDef("←⟵", "e", "solid", "solid", { heads:["w"] });
dgDef("↑", "s", "solid", "solid", { heads:["n"] });
dgDef("↓", "n", "solid", "solid", { heads:["s"] });
dgDef("↔", "ew", "solid", "solid", { heads:["e", "w"] });
dgDef("↕", "ns", "solid", "solid", { heads:["n", "s"] });
dgDef("⇒", "w", "double", "double", { heads:["e"] });
dgDef("⇐", "e", "double", "double", { heads:["w"] });
dgDef("⇑", "s", "double", "double", { heads:["n"] });
dgDef("⇓", "n", "double", "double", { heads:["s"] });
dgDef("⇔", "ew", "double", "double", { heads:["e", "w"] });
dgDef("▶▷►▸", "", "solid", "solid", { heads:["e"], tail:true });   // tail: joined to a line behind it
dgDef("◀◁◄◂", "", "solid", "solid", { heads:["w"], tail:true });
dgDef("▲△▴", "", "solid", "solid", { heads:["n"], tail:true });
dgDef("▼▽▾", "", "solid", "solid", { heads:["s"], tail:true });
dgDef("●○◆◇■□•", "", "solid", "solid", { node:true });           // markers: only when a line touches them
const DG_D = { n:[-1, 0], e:[0, 1], s:[1, 0], w:[0, -1], ne:[-1, 1], se:[1, 1], sw:[1, -1], nw:[-1, -1] };
const DG_OPP = { n:"s", s:"n", e:"w", w:"e", ne:"sw", sw:"ne", nw:"se", se:"nw" };
const DG_WORD = /[\p{L}\p{N}]/u;
const dgGlyph = ch => DG_GLYPH[ch] || DG_GLYPH[ch.replace(/[︎️]/g, "")];
const dgIn = (set, ch) => ch.length === 1 && ch !== " " && set.includes(ch);

/* Per-cell classification: null (text or space) or { g:"line"|"head"|"dot", ch, dirs:Set,
   style, hs, vs, round?, low?, heads? }. ASCII characters are lines only in context (so
   e-mail, and/or, v1.2, a | b, => stay prose); the rules are iterated to a fixpoint because
   a cell that becomes a line can make its neighbour one. */
function dgScan(grid){
  const { rows, cols, at } = grid;
  const S = Array.from({ length:rows }, () => Array(cols).fill(null));
  const get = (r, c) => (S[r] && S[r][c]) || null;
  const has = (r, c, d) => { const x = get(r, c); return !!x && x.dirs.has(d); };
  const word = (r, c) => { const ch = at(r, c); return ch === "" || DG_WORD.test(ch); };
  const hLine = x => !!x && x.dirs.has("e") && x.dirs.has("w");
  const mk = (g, ch, dirs, hs = "solid", vs = hs, more) => ({ g, ch, dirs:new Set(dirs), style:hs, hs, vs, ...more });
  /* directions whose neighbour has a stroke pointing back at (r, c) */
  const links = (r, c) => Object.keys(DG_D).filter(d => has(r + DG_D[d][0], c + DG_D[d][1], DG_OPP[d]));
  const vHead = (r, c) => /^[vV]$/.test(at(r, c)) && !word(r, c - 1) && !word(r, c + 1);
  const oNode = (r, c) => /^[oO]$/.test(at(r, c)) && !word(r, c - 1) && !word(r, c + 1);
  /* can a short -/=/_ run end on (r, c)? `right` = it is the cell after the run */
  const hEnd = (r, c, right, eq, len) => {
    const ch = at(r, c);
    if(get(r, c) || dgGlyph(ch) || dgIn("+|.'`*", ch)) return true;
    if(ch === (right ? ">" : "<")) return (!eq || len >= 2) && !word(r, right ? c + 1 : c - 1);   // -> yes, => no
    return oNode(r, c);
  };
  const rule = (r, c) => {
    const ch = at(r, c), L = c - 1, R = c + 1;
    if(ch === "-" || ch === "=" || ch === "_"){
      let a = c, b = c;
      while(at(r, a - 1) === ch) a--;
      while(at(r, b + 1) === ch) b++;
      const len = b - a + 1, eq = ch === "=";
      if(len < 3 && !hEnd(r, a - 1, false, eq, len) && !hEnd(r, b + 1, true, eq, len)) return null;
      return mk("line", ch, "ew", eq ? "double" : "solid", undefined, { low:ch === "_" });
    }
    if(ch === "|"){
      const up = at(r - 1, c), ux = get(r - 1, c), dx = get(r + 1, c);
      const vUp = dgIn("|:+.*^", up) || oNode(r - 1, c) || (!!ux && (ux.dirs.has("s") || hLine(ux)));
      const vDn = dgIn("|:+'`*", at(r + 1, c)) || vHead(r + 1, c) || oNode(r + 1, c) || (!!dx && (dx.dirs.has("n") || hLine(dx)));
      const diag = has(r - 1, c - 1, "se") || has(r - 1, c + 1, "sw") || has(r + 1, c - 1, "ne") || has(r + 1, c + 1, "nw");
      return vUp || vDn || diag ? mk("line", ch, "ns") : null;
    }
    if(ch === ":"){
      if(word(r, L) || word(r, R)) return null;                  // key: value
      return dgIn(":|", at(r - 1, c)) || dgIn(":|", at(r + 1, c)) ? mk("line", ch, "ns", "dashed") : null;
    }
    if(ch === "+"){ const d = links(r, c); return d.length ? mk("line", ch, d) : null; }
    if(ch === "." || ch === "'" || ch === "`"){                  // rounded corners: .-- over |, '-- under |
      const h = ["e", "w"].filter(d => has(r, c + DG_D[d][1], DG_OPP[d]));
      const v = ch === "." ? "s" : "n", vr = r + DG_D[v][0];
      if(!h.length || !(dgIn("|:", at(vr, c)) || has(vr, c, DG_OPP[v]))) return null;
      return mk("line", ch, [...h, v], "solid", "solid", { round:h.length === 1 });
    }
    if(ch === "/" || ch === "\\"){
      const ends = ch === "/" ? [[-1, 1], [1, -1]] : [[-1, -1], [1, 1]], alt = ch === "/" ? "╱" : "╲";
      const ok = ([dr, dc]) => { const x = at(r + dr, c + dc); return x === ch || x === alt || x === "╳" || dgIn("+*<>", x); };
      return ends.some(ok) ? mk("line", ch, ch === "/" ? ["ne", "sw"] : ["nw", "se"]) : null;
    }
    if(ch === ">" || ch === "<"){
      const e = ch === ">", out = e ? "e" : "w";
      if(e ? has(r - 1, c - 1, "se") && has(r + 1, c - 1, "ne") : has(r - 1, c + 1, "sw") && has(r + 1, c + 1, "nw")){
        const d = e ? ["nw", "sw"] : ["ne", "se"];              // a diamond's side vertex
        if(has(r, c + DG_D[out][1], DG_OPP[out])) d.push(out);
        return mk("line", ch, d);
      }
      const from = get(r, e ? R : L), wall = get(r, e ? L : R);  // ───<│ │>─── ER "many": a crow's foot
      if(from && from.dirs.has(out) && wall && wall.g === "line" && wall.dirs.has("n") && wall.dirs.has("s"))
        return mk("line", ch, ["e", "w"], from.hs, from.hs, { foot:DG_OPP[out] });
      const back = get(r, e ? L : R);
      if(back && back.g === "line" && back.dirs.has(out) && !word(r, e ? R : L))    // --> but not p->next
        return mk("head", ch, [DG_OPP[out]], back.hs, back.hs, { heads:[out] });
      return null;
    }
    if(ch === "^") return has(r + 1, c, "n") && !word(r, L) && !word(r, R) ? mk("head", ch, ["s"], "solid", get(r + 1, c).vs, { heads:["n"] }) : null;
    if(ch === "v" || ch === "V") return has(r - 1, c, "s") && vHead(r, c) ? mk("head", ch, ["n"], "solid", get(r - 1, c).vs, { heads:["s"] }) : null;
    if(dgIn("*oO#", ch) || (dgGlyph(ch) && dgGlyph(ch).node)){
      if(!dgGlyph(ch) && (word(r, L) || word(r, R))) return null;
      const d = links(r, c);
      return d.length ? mk("dot", ch, d, "solid", "solid", { hollow:/^[○◇□oO]$/.test(ch) }) : null;
    }
    return null;
  };
  /* 1. box-drawing glyphs */
  for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
    const d = dgGlyph(at(r, c));
    if(d && !d.node) S[r][c] = mk(d.heads ? "head" : "line", at(r, c), d.dirs, d.hs, d.vs, { round:!!d.round, heads:d.heads, tail:!!d.tail });
  }
  /* 2. ASCII in context, until nothing changes */
  for(let changed = true, n = 0; changed && n < 64; n++){
    changed = false;
    for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
      if(S[r][c]) continue;
      const ch = at(r, c);
      if(ch === " " || ch === "") continue;
      const x = rule(r, c);
      if(x){ S[r][c] = x; changed = true; }
    }
  }
  /* 3. directions that depend on the final neighbours */
  for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
    const x = S[r][c]; if(!x) continue;
    if(x.ch === "+" || x.g === "dot") x.dirs = new Set(links(r, c));
    if(x.ch === "|"){                                            // the bottom tip of a diamond: \ | /
      const nw = has(r - 1, c - 1, "se"), ne = has(r - 1, c + 1, "sw"), sw = has(r + 1, c - 1, "ne"), se = has(r + 1, c + 1, "nw");
      if(!get(r - 1, c) && (nw || ne)){ x.dirs.delete("n"); if(nw) x.dirs.add("nw"); if(ne) x.dirs.add("ne"); }
      if(!get(r + 1, c) && (sw || se)){ x.dirs.delete("s"); if(sw) x.dirs.add("sw"); if(se) x.dirs.add("se"); }
    }
    if(x.tail) for(const h of x.heads){                          // ▶ joined to the line behind it
      const b = DG_OPP[h];
      if(has(r + DG_D[b][0], c + DG_D[b][1], h)) x.dirs.add(b);
    }
  }
  /* 4. snapping: a line ending right next to a straight perpendicular line joins it
        (a | under a box's bottom edge, a ── running into a │ side) */
  for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
    const x = S[r][c]; if(!x) continue;
    for(const d of ["n", "e", "s", "w"]){
      if(!x.dirs.has(d)) continue;
      const y = get(r + DG_D[d][0], c + DG_D[d][1]);
      if(!y || y.g !== "line" || y.round || y.low || y.dirs.has(DG_OPP[d])) continue;
      const vert = d === "n" || d === "s";
      if(![...y.dirs].every(k => vert ? k === "e" || k === "w" : k === "n" || k === "s")) continue;
      y.dirs.add(DG_OPP[d]);
      if(vert) y.vs = x.vs; else y.hs = x.hs;
    }
  }
  /* 5. a corner or junction continues the dashes of the edge it joins (┌┄┄┐ is dashed end to end) */
  for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
    const x = S[r][c]; if(!x || x.g !== "line") continue;
    for(const d of ["n", "e", "s", "w"]){
      const y = x.dirs.has(d) && get(r + DG_D[d][0], c + DG_D[d][1]), k = d === "n" || d === "s" ? "vs" : "hs";
      if(y && y.dirs.has(DG_OPP[d]) && y[k] === "dashed" && x[k] === "solid" && x.dirs.size > 1 && !(x.dirs.size === 2 && x.dirs.has(DG_OPP[d]))) x[k] = "dashed";
    }
  }
  return S;
}

/* Geometry: { segs, boxes, heads, dots, texts }. The centre of cell (r, c) is
   (c*CW + CW/2, r*CH + CH/2); every stroke goes from a centre to an edge (or a corner for
   diagonals) and collinear stubs are merged into long segments. */
function dgModel(grid, cells){
  const { rows, cols, at } = grid, CW = DG_CW, CH = DG_CH;
  const get = (r, c) => (cells[r] && cells[r][c]) || null;
  const has = (r, c, d) => { const x = get(r, c); return !!x && x.dirs.has(d); };
  const line = (r, c) => { const x = get(r, c); return x && x.g === "line" ? x : null; };
  const X = c => c * CW + CW / 2, Y = r => r * CH + CH / 2;
  const edge = (r, c, d) => [X(c) + DG_D[d][1] * CW / 2, Y(r) + DG_D[d][0] * CH / 2];
  const segs = [], heads = [], dots = [], texts = [], boxes = [], feet = [];
  const runs = new Map();                                        // "h:row" → [[from, to, style]]
  const stub = (key, a, b, style) => { if(!runs.has(key)) runs.set(key, []); runs.get(key).push([Math.min(a, b), Math.max(a, b), style || "solid"]); };
  for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
    const x = get(r, c); if(!x) continue;
    const cx = X(c), cy = Y(r);
    if(x.round && x.dirs.size === 2){                           // ╭ . ' : a quarter curve through the centre
      const [p, q] = [...x.dirs].map(d => edge(r, c, d));
      segs.push({ kind:"curve", x1:p[0], y1:p[1], x2:q[0], y2:q[1], cx, cy, style:x.hs });
    }
    else for(const d of x.dirs){
      const [dr, dc] = DG_D[d];
      if(d === "e" || d === "w"){
        if(!x.low){ stub("h:" + r, cx, cx + dc * CW / 2, x.hs); continue; }
        stub("l:" + r, cx, cx + dc * CW / 2, x.hs);              // _ sits on the bottom of its cell…
        const n = get(r, c + dc);
        if(n && n.dirs.has("n") && !n.low) stub("l:" + r, cx + dc * CW / 2, X(c + dc), x.hs);   // …and reaches a | beside it
      }
      else if(d === "n" || d === "s") stub("v:" + c, cy, cy + dr * CH / 2, x.vs);
      else if(d === "ne" || d === "sw") stub("d:" + (r + c), cx, cx + dc * CW / 2, x.hs);
      else stub("b:" + (r - c), cx, cx + dc * CW / 2, x.hs);
    }
    if(x.g === "head") for(const h of x.heads){
      const [dr, dc] = DG_D[h], hz = !dr;
      let [tx, ty] = edge(r, c, h);
      if(get(r + dr, c + dc)){ tx = X(c + dc); ty = Y(r + dr); }  // the tip touches the line it points at
      const len = hz ? 7 : 8, bx = tx - dc * len, by = ty - dr * len;
      if(x.dirs.has(DG_OPP[h])){ if(hz) stub("h:" + r, cx, bx, x.hs); else stub("v:" + c, cy, by, x.vs); }
      heads.push({ r, c, dir:h, x:tx, y:ty, points:hz ? [[tx, ty], [bx, by - 4], [bx, by + 4]] : [[tx, ty], [bx - 4, by], [bx + 4, by]] });
    }
    if(x.g === "dot") dots.push({ r, c, x:cx, y:cy, hollow:!!x.hollow, node:!dgIn("*oO#", x.ch) });
    if(x.foot){                                                  // prongs from the far edge of the cell to the box side
      const dc = DG_D[x.foot][1], vx = cx - dc * CW / 2, tx = X(c + dc);
      feet.push({ r, c, dir:x.foot, points:[[vx, cy], [tx, cy - 5], [tx, cy + 5]] });
    }
  }
  for(const [key, list] of runs){
    const t = key[0], n = +key.slice(2);
    const put = ([a, b, style]) => {
      if(b - a < 0.01) return;
      if(t === "h" || t === "l"){ const y = t === "h" ? Y(n) : (n + 1) * CH; segs.push({ kind:"h", x1:a, y1:y, x2:b, y2:y, style }); }
      else if(t === "v") segs.push({ kind:"v", x1:X(n), y1:a, x2:X(n), y2:b, style });
      else{
        const y = t === "d" ? v => (n + 1) * CH - v * CH / CW : v => v * CH / CW + n * CH;
        segs.push({ kind:"d", x1:a, y1:y(a), x2:b, y2:y(b), style });
      }
    };
    list.sort((p, q) => p[0] - q[0] || p[1] - q[1]);
    let cur = null;
    for(const s of list){
      if(cur && s[0] <= cur[1] + 0.01 && s[2] === cur[2]) cur[1] = Math.max(cur[1], s[1]);
      else{ if(cur) put(cur); cur = s.slice(); }
    }
    if(cur) put(cur);
  }

  /* boxes: from a top-left corner follow the top edge (one text gap allowed: a title in the
     border), then both sides down to a bottom edge. Full-width rows met on the way that
     continue downwards are dividers. Anything that doesn't close is just lines. */
  const hLink = (r, a, b) => { for(let c = a; c < b; c++) if(!has(r, c, "e") || !has(r, c + 1, "w")) return false; return true; };
  const close = (r1, c1, c2) => {
    const divs = [];
    for(let r = r1; r < rows; r++){
      const R = r + 1;
      if(!has(r, c1, "s") || !has(r, c2, "s") || !line(R, c1) || !line(R, c2) || !has(R, c1, "n") || !has(R, c2, "n"))
        return divs.length ? { r2:divs.pop(), divs } : null;
      if(has(R, c1, "e") && has(R, c2, "w") && hLink(R, c1, c2)){
        if(has(R, c1, "s") && has(R, c2, "s")) divs.push(R);
        else return { r2:R, divs };
      }
    }
    return null;
  };
  for(let r1 = 0; r1 < rows; r1++) for(let c1 = 0; c1 < cols; c1++){
    const tl = line(r1, c1);
    if(!tl || !tl.dirs.has("e") || !tl.dirs.has("s") || tl.dirs.has("n")) continue;
    let c = c1, title = "";
    while(has(r1, c, "e")){
      let n = c + 1;
      if(!has(r1, n, "w")){
        if(title || get(r1, n)) break;
        let k = n; while(k < cols && !get(r1, k)) k++;
        const t = [...Array(k - n).keys()].map(i => at(r1, n + i)).join("").trim();
        if(!t || !has(r1, k, "w")) break;
        title = t; n = k;
      }
      c = n;
      const tr = line(r1, c);
      if(!tr || !tr.dirs.has("s") || tr.dirs.has("n")) continue;
      const shut = close(r1, c1, c);
      if(shut){
        const style = (line(r1, c1 + 1) || tl).hs;
        boxes.push({ r1, c1, r2:shut.r2, c2:c, title, dividers:shut.divs, style, round:!!tl.round,
                     group:!!title || style === "dashed", depth:0 });
        break;
      }
    }
  }
  const inside = (o, b) => o !== b && o.r1 <= b.r1 && o.c1 <= b.c1 && o.r2 >= b.r2 && o.c2 >= b.c2;
  boxes.forEach(b => { b.depth = boxes.filter(o => inside(o, b)).length; });

  /* text: runs of non-line characters; one space joins words, two or more split them */
  const isT = (r, c) => c < cols && at(r, c) !== " " && !get(r, c);
  const hl = x => !!x && ((x.dirs.has("e") && x.dirs.has("w")) || (x.g === "head" && x.heads.some(h => h === "e" || h === "w")));
  const side = (r, c, dc) => get(r, c) || (at(r, c) === " " ? get(r, c + dc) : null);
  for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){
    if(!isT(r, c)) continue;
    let e = c;
    while(isT(r, e + 1) || (at(r, e + 1) === " " && !get(r, e + 1) && isT(r, e + 2))) e += isT(r, e + 1) ? 1 : 2;
    const t = { r, c, w:e - c + 1, text:[...Array(e - c + 1).keys()].map(i => at(r, c + i)).join(""), hd:false, label:false, title:false };
    t.title = boxes.some(b => b.title && r === b.r1 && c > b.c1 && e < b.c2);
    let gap = false;
    for(let k = c; k <= e && !gap; k++) gap = has(r - 1, k, "s") && has(r + 1, k, "n");   // "yes" in a gap of a | line
    t.label = !t.title && ((hl(side(r, c - 1, -1)) && hl(side(r, e + 1, 1))) || gap);
    t.hd = boxes.some(b => b.dividers.length && r > b.r1 && r < b.dividers[0] && c > b.c1 && e < b.c2);
    texts.push(t);
    c = e;
  }
  /* a box titled in its border with a single row of its own text: that row is the header */
  const own = (b, t) => t.r > b.r1 && t.r < b.r2 && t.c > b.c1 && t.c + t.w - 1 < b.c2 &&
    !boxes.some(o => o !== b && inside(b, o) && t.r > o.r1 && t.r < o.r2 && t.c > o.c1 && t.c < o.c2);
  for(const b of boxes){
    if(!b.title || b.dividers.length) continue;
    const mine = texts.filter(t => own(b, t));
    if(mine.length && mine.every(t => t.r === mine[0].r)) mine.forEach(t => { t.hd = true; });
  }
  return { segs, boxes, heads, dots, texts, feet };
}

/* the picture: filled boxes, then lines, then heads, then text — all through createElementNS
   and textContent, never innerHTML */
const SVG_NS = "http://www.w3.org/2000/svg";
function dgSvg(model, rows, cols){
  const CW = DG_CW, CH = DG_CH, n = v => String(Math.round(v * 100) / 100);
  const el = (tag, attrs, cls) => {
    const e = document.createElementNS(SVG_NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    if(cls) e.setAttribute("class", cls);
    return e;
  };
  const W = cols * CW, H = rows * CH;
  const svg = el("svg", { viewBox:`0 0 ${W} ${H}`, width:W, height:H, role:"img", "aria-label":"Diagram" }, "dg-svg");
  const [gb, gl, gh, gt] = ["dg-boxes", "dg-lines", "dg-heads", "dg-text"].map(c => svg.appendChild(el("g", {}, c)));
  [...model.boxes].sort((a, b) => a.depth - b.depth).forEach(b => gb.appendChild(el("rect", {
    x:n(b.c1 * CW + CW / 2), y:n(b.r1 * CH + CH / 2), width:n((b.c2 - b.c1) * CW), height:n((b.r2 - b.r1) * CH),
    rx:b.round ? 8 : 4, "data-depth":b.depth }, "dg-box" + (b.group ? " dg-group" : ""))));
  for(const s of model.segs){
    let d;
    if(s.kind === "curve") d = `M${n(s.x1)} ${n(s.y1)}Q${n(s.cx)} ${n(s.cy)} ${n(s.x2)} ${n(s.y2)}`;
    else if(s.style === "double" && s.kind === "h") d = `M${n(s.x1)} ${n(s.y1 - 1.25)}H${n(s.x2)}M${n(s.x1)} ${n(s.y1 + 1.25)}H${n(s.x2)}`;
    else if(s.style === "double" && s.kind === "v") d = `M${n(s.x1 - 1.25)} ${n(s.y1)}V${n(s.y2)}M${n(s.x1 + 1.25)} ${n(s.y1)}V${n(s.y2)}`;
    else d = `M${n(s.x1)} ${n(s.y1)}L${n(s.x2)} ${n(s.y2)}`;
    gl.appendChild(el("path", { d }, "dg-line" + (s.style && s.style !== "solid" ? " dg-" + s.style : "")));
  }
  model.heads.forEach(h => gh.appendChild(el("polygon", { points:h.points.map(p => n(p[0]) + "," + n(p[1])).join(" ") }, "dg-head")));
  model.feet.forEach(f => { const [v, a, b] = f.points.map(p => n(p[0]) + " " + n(p[1]));
    gh.appendChild(el("path", { d:`M${a}L${v}L${b}` }, "dg-foot")); });
  model.dots.forEach(d => gh.appendChild(el("circle", { cx:n(d.x), cy:n(d.y), r:d.node ? 3.5 : 2.6 }, "dg-dot" + (d.hollow ? " dg-hollow" : ""))));
  model.texts.forEach(t => {
    const e = el("text", { x:n(t.c * CW), y:n(t.r * CH + CH / 2), textLength:n(t.w * CW), lengthAdjust:"spacingAndGlyphs", "dominant-baseline":"central" },
      "dg-t" + (t.hd ? " dg-hd" : "") + (t.label ? " dg-label" : "") + (t.title ? " dg-title" : ""));
    e.textContent = t.text;
    gt.appendChild(e);
  });
  return svg;
}

/* ── trees and outlines ── */
/* ├── └── ┣━ |-- +-- `-- \-- |__ after any │ / | / space prefix; the name must not start with a line */
const DG_BRANCH = /^([ │|┃]*?)([├└┣┗╠╚][─━═]+|[|+`\\](?:-{2,}|_{2,}))\s*([^\s←-⇿─-◿|+\-=<>].*)$/u;
const DG_FILLER = /^[ │|┃]+$/;                // a line that only carries the tree's verticals
/* "index.ts      # entry point" → name + note (after two spaces: # // <-- <- ←) */
function dgItem(s){
  const m = /^(.*?\S)\s{2,}(?:#|\/\/|<--?|←)\s*(.*)$/.exec(s);
  return { name:(m ? m[1] : s).trim(), note:m ? m[2].trim() : "" };
}
/* [{name, note, folder, children}]; depth comes from the column where the branch marker
   (tree) or the text (outline) starts, compared on a stack so 2/3/4-column steps all work */
function dgTree(lines){
  const roots = [], stack = [], tree = lines.some(l => DG_BRANCH.test(l));
  for(const l of lines){
    if(!l.trim() || (tree && DG_FILLER.test(l))) continue;
    const m = tree && DG_BRANCH.exec(l);
    const col = m ? m[1].length : tree ? -1 : /^ */.exec(l)[0].length;
    const { name, note } = dgItem(m ? m[3] : l.trim().replace(/^[-*•+]\s+/, ""));
    const node = { name:name.replace(/\/$/, "") || name, note, folder:/\/$/.test(name), children:[] };
    while(stack.length && stack[stack.length - 1][0] >= col) stack.pop();
    (stack.length ? stack[stack.length - 1][1].children : roots).push(node);
    stack.push([col, node]);
  }
  const mark = n => { if(n.children.length) n.folder = true; n.children.forEach(mark); };
  roots.forEach(mark);
  return roots;
}
/* ul.dg-tree: folders are <details open> (collapsible, view-only), files are .dg-file */
function dgTreeEl(nodes){
  const list = (items, top) => {
    const ul = document.createElement("ul");
    if(top) ul.className = "dg-tree";
    for(const n of items){
      const li = ul.appendChild(document.createElement("li"));
      const name = document.createElement("span");
      name.className = n.folder ? "dg-dir" : "dg-file"; name.textContent = n.name;
      let host = li, det = null;
      if(n.folder){ det = li.appendChild(document.createElement("details")); det.setAttribute("open", ""); host = det.appendChild(document.createElement("summary")); }
      host.appendChild(name);
      if(n.note){ const s = host.appendChild(document.createElement("span")); s.className = "dg-note"; s.textContent = n.note; }
      if(det) det.appendChild(list(n.children));
    }
    return ul;
  };
  return list(nodes, true);
}

/* an ASCII table is one rectangle: borders without gaps, and every row's bars on exactly the
   columns of the border's corners / junctions (so cards side by side or boxes nested in a
   frame are drawings, not tables) */
function dgTable(body){
  const g = dgGrid(body);
  const at = (r, test) => g.cells[r].reduce((a, ch, c) => test(ch) ? a + c + "," : a, "");
  const joints = r => at(r, ch => !/^[\s\-=:─━═]$/.test(ch)), cols = joints(0);
  return body.every((l, r) => mdBorder(l)                        // no box-drawing inside a row but │ ┃ ║
    ? !/\S\s+\S/.test(l) && joints(r) === cols
    : !/[─━┄-═╒-╿]/.test(l) && at(r, ch => /^[|│┃║]$/.test(ch)) === cols);
}
/* "tree" | "table" | "grid" | "outline" | "text", checked in that order */
function dgKind(lines){
  const body = lines.filter(l => l.trim());
  if(!body.length) return "text";
  if(body.filter(l => DG_BRANCH.test(l)).length >= 2 && body.every((l, i) => !i || DG_BRANCH.test(l) || DG_FILLER.test(l))) return "tree";
  const ind = l => /^ */.exec(l)[0].length;
  const bars = body.filter(l => !mdBorder(l));
  if(mdBorder(body[0]) && mdBorder(body[body.length - 1]) && bars.length >= 2 &&
     bars.every(l => MD.bar.test(l)) && dgTable(body)) return "table";
  if(body.length >= 2 && mdTable(body[0], body[1]) && body.slice(2).every(l => l.includes("|"))) return "table";
  if(dgScan(dgGrid(lines)).some(row => row.some(Boolean))) return "grid";
  if(body.length >= 2 && new Set(body.map(ind)).size >= 2) return "outline";
  return "text";
}
/* strict test for the markdown paste: only what clearly is a drawing */
function dgLooks(text){
  try{
    const lines = dgNormalize(text), kind = dgKind(lines);
    if(kind === "tree") return true;
    if(kind !== "grid") return false;
    const g = dgGrid(lines), m = dgModel(g, dgScan(g));
    return m.boxes.length > 0 || m.heads.length > 0 || (String(text).match(/[─-╿]/g) || []).length >= 3;
  }catch(e){ return false; }
}
/* { kind, el } for decorate(); el is null (with a note) when there is nothing to draw */
function dgRender(text){
  const lines = dgNormalize(text), g = dgGrid(lines);
  if(g.rows > 400 || g.cols > 300) return { kind:"", el:null, note:"Too large to draw" };
  const kind = dgKind(lines);
  if(kind === "text") return { kind, el:null, note:"No diagram shapes found" };
  const el = document.createElement("div");
  el.className = "dg";
  if(kind === "tree" || kind === "outline") el.appendChild(dgTreeEl(dgTree(lines)));
  else if(kind === "table"){
    const body = lines.filter(l => l.trim()), rows = mdBorder(body[0])
      ? body.filter(l => !mdBorder(l)).map(mdCells)
      : [body[0], ...body.slice(2)].map(mdCells);
    el.innerHTML = clean(mdTableHtml(rows[0], rows.slice(1)));
  }
  else el.appendChild(dgSvg(dgModel(g, dgScan(g)), g.rows, g.cols));
  return { kind, el };
}

/* ═══════════════════════════ document ═══════════════════════════ */
/* db.selected is the highlighted row (may be a folder); openId is the page shown in
   the document panel. Everything that edits the page goes by openId. */
let openId = null;
const openPage = () => { const f = openId && find(openId); return f && f.node.type === "page" ? f : null; };
function open(id){
  const f = find(id); if(!f || f.node.type !== "page") return;
  if(mode !== "view"){
    /* switching pages mid-edit: flush the unsaved text to the page it belongs to
       (db.selected already points at the new one, so commit() can't be used) */
    clearTimeout(typeTimer);
    const prev = openId && find(openId);
    if(prev && prev.node.type === "page"){
      prev.node.content = mode === "edit" ? editor.innerHTML : unformat(source.value);
      save();
    }
    mode = "view";                            // so setMode() doesn't copy the old page into raw
  }
  openId = id;
  raw = f.node.content || "";
  titleEl.value = f.node.name;
  setMode("view");
  render();
}
function crumbs(){
  if(!openPage()){ $("crumbs").textContent = ""; return; }
  const path = chainOf(openId).map(n => n.name);
  $("crumbs").textContent = path.length ? path.join("  /  ") + "  /" : "";
}
function render(){
  const has = !!openPage();
  docEl.style.display = has ? "flex" : "none";
  emptyEl.style.display = has ? "none" : "flex";
  if(!has){
    if(mode !== "view"){ mode = "view"; setMode("view"); }   // the page being edited is gone
    return;
  }
  crumbs();
  viewer.innerHTML = clean(raw);
  decorate(viewer);
}
/* view-mode chrome for code blocks: a bar with a collapse toggle, the language, the line
   count and Copy. Blocks start collapsed on every render; the state lives only in the
   viewer DOM (never in `raw`), so nothing about it is stored or exported. */
const CHEV = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 6 8 10.5 12.5 6"/></svg>';
function decorate(root){
  root.querySelectorAll("pre.code").forEach(pre => {
    const lang = pre.dataset.lang || "plain";
    const code = pre.textContent.replace(/\u200B/g, "");
    pre.innerHTML = highlight(code, lang);
    const wrap = document.createElement("div");
    wrap.className = "code-wrap collapsed";
    const bar = document.createElement("div");
    bar.className = "code-bar";
    const n = code.replace(/\n$/, "").split("\n").length;
    /* a diagram is drawn next to its text; one bad block falls back to text and never stops the rest */
    let dg = null;
    if(lang === "diagram"){
      try{ dg = dgRender(code); }
      catch(err){ dg = { kind:"", el:null, note:"Couldn't draw this diagram — showing text" }; }
    }
    bar.innerHTML = `<button class="tog" aria-expanded="false" title="Expand">${CHEV}</button>` +
                    `<span>${esc((LANGS[lang]||{}).label || lang)}${dg && dg.kind ? `<i class="dg-kind"> · ${esc(dg.kind)}</i>` : ""}</span>` +
                    `<span class="n">${n} line${n !== 1 ? "s" : ""}</span>`;
    bar.querySelector(".tog").onclick = e => {
      const open = wrap.classList.toggle("collapsed") === false;
      e.currentTarget.setAttribute("aria-expanded", String(open));
      e.currentTarget.title = open ? "Collapse" : "Expand";
    };
    const copy = document.createElement("button");
    copy.className = "copy"; copy.textContent = "Copy";
    copy.onclick = () => {
      if(!navigator.clipboard){ toast("Clipboard blocked by the browser"); return; }
      navigator.clipboard.writeText(code).then(() => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1400); })
        .catch(() => toast("Clipboard blocked by the browser"));
    };
    if(dg && dg.el){                            // Text ⇄ Diagram; like collapsing, never stored
      wrap.classList.add("dg-on");
      const view = document.createElement("button");
      view.className = "view"; view.textContent = "Text"; view.title = "Show source text";
      view.onclick = () => {
        const on = wrap.classList.toggle("dg-on");
        view.textContent = on ? "Text" : "Diagram";
        view.title = on ? "Show source text" : "Show diagram";
      };
      bar.appendChild(view);
    }
    bar.appendChild(copy);
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(bar);
    if(dg && dg.note){ const m = document.createElement("div"); m.className = "dg-msg"; m.textContent = dg.note; wrap.appendChild(m); }
    wrap.appendChild(pre);
    if(dg && dg.el) wrap.appendChild(dg.el);
  });
}
function commit(){
  const f = openPage(); if(!f) return;
  if(mode === "edit"){ tail(); raw = editor.innerHTML; }   // appending never moves the caret
  if(mode === "source") raw = unformat(source.value);
  f.node.content = raw;
  save(); flag("Saved");
}
function setMode(m){
  if(mode === "edit" && m !== "edit") raw = editor.innerHTML;
  if(mode === "source" && m !== "source") raw = unformat(source.value);
  mode = m;
  viewer.style.display = m === "view" ? "" : "none";
  editor.style.display = m === "edit" ? "" : "none";
  source.style.display = m === "source" ? "" : "none";
  $("scroll").querySelector(".page").style.display = m === "source" ? "none" : "";
  toolbar.style.display = m === "edit" ? "" : "none";
  $("btnMode").textContent = m === "view" ? "Edit" : "Done";
  $("btnMode").className = m === "view" ? "btn" : "btn primary";
  $("btnSource").style.opacity = m === "source" ? 1 : .7;
  statusEl.textContent = m === "view" ? "" : "Editing";
  if(m === "edit"){
    editor.innerHTML = raw && raw.trim() ? raw : "<p><br></p>";
    tail();                                   // always leave somewhere to type
    try{ document.execCommand("defaultParagraphSeparator", false, "p"); }catch(err){}
    editor.focus(); caretTo(editor.lastElementChild || editor);
    raw = editor.innerHTML;
  }
  if(m === "source"){ source.value = format(raw); }
  if(m === "view") render();
  syncBlocks();
}
/* source view: one tag per line. unformat() undoes exactly that, so a round trip
   through the HTML view never adds whitespace (which would show up inside
   white-space:pre-wrap blocks such as quotes and list items) */
function format(html){
  return html.replace(/></g, ">\n<");
}
function unformat(html){
  return html.replace(/>\n</g, "><");
}
$("btnMode").onclick = () => { if(mode === "view") setMode("edit"); else { commit(); setMode("view"); } };
$("btnSource").onclick = () => { if(mode === "source"){ commit(); setMode("edit"); } else setMode("source"); };
$("btnFirst").onclick = addPage;
$("btnPage").onclick = addPage;
$("btnFolder").onclick = addFolder;

titleEl.addEventListener("input", () => {
  const f = openPage(); if(!f) return;
  f.node.name = titleEl.value.trim() || "Untitled page";
  save(); renderTree(); crumbs();
});

function caretTo(el, atEnd = true){
  const r = document.createRange();
  r.selectNodeContents(el); r.collapse(!atEnd);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
/* the page always ends with an empty line: after a code block, list, table or
   image there would otherwise be no way to move the caret below it, and
   after text it gives the cursor somewhere to go with ↓ / click */
function tail(){
  const last = editor.lastElementChild;
  const empty = last && last.tagName === "P" && !last.textContent.trim() && !last.querySelector("img,table,pre");
  if(!empty){
    const p = document.createElement("p");
    p.innerHTML = "<br>";
    editor.appendChild(p);
  }
}
/* clicking the blank space under the text should put the caret at the end */
$("scroll").addEventListener("mousedown", e => {
  if(mode !== "edit") return;
  if(e.target !== $("scroll") && e.target !== $("page")) return;
  e.preventDefault(); tail();
  editor.focus(); caretTo(editor.lastElementChild || editor);
});
/* Enter or Tab in the title moves straight into the body */
titleEl.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== "Tab") return;
  e.preventDefault();
  if(mode === "view") setMode("edit"); else { editor.focus(); caretTo(editor.firstElementChild || editor, false); }
});

let typeTimer = null;
editor.addEventListener("input", () => {
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => { raw = editor.innerHTML; commit(); }, 500);
});
source.addEventListener("input", () => {
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => { raw = unformat(source.value); commit(); }, 500);
});

/* paste as clean html (or plain text inside code blocks); a copied image is embedded as base64 */
editor.addEventListener("paste", e => {
  e.preventDefault();
  const inPre = currentPre();
  const img = !inPre && [...(e.clipboardData.files || [])].find(f => f.type.startsWith("image/"));
  if(img){ insertImage(img); return; }
  const html = e.clipboardData.getData("text/html");
  const text = e.clipboardData.getData("text/plain");
  if(inPre || !html) insertText(text);
  else document.execCommand("insertHTML", false, clean(html));
  raw = editor.innerHTML; commit();           // insertText() changes the DOM without an input event
});

/* ═══════════════════════════ editor commands ═══════════════════════════ */
toolbar.querySelectorAll("button[data-cmd]").forEach(b => {
  b.onmousedown = e => e.preventDefault();
  b.onclick = () => {
    editor.focus();
    document.execCommand(b.dataset.cmd, false, b.dataset.val || null);
    raw = editor.innerHTML; commit();
  };
});
function currentPre(){
  const s = getSelection();
  if(!s.rangeCount) return null;
  let n = s.getRangeAt(0).startContainer;
  n = n.nodeType === 3 ? n.parentNode : n;
  return n && n.closest ? n.closest("pre.code") : null;
}
/* text goes in through execCommand so the browser's undo stack records it
   (Ctrl+Z); the Range API is only a fallback for engines without the command */
function insertText(t){
  const s = getSelection(); if(!s.rangeCount) return;
  if(document.execCommand("insertText", false, t)) return;
  const r = s.getRangeAt(0); r.deleteContents();
  const node = document.createTextNode(t);
  r.insertNode(node); r.setStartAfter(node); r.collapse(true);
  s.removeAllRanges(); s.addRange(r);
}
$("tbBlock").onmousedown = e => e.preventDefault();
$("tbBlock").onclick = () => {
  editor.focus();
  if(currentPre()) return;                   // already inside a block
  const sel = getSelection().toString();
  const had = new Set(editor.querySelectorAll("pre"));
  document.execCommand("insertHTML", false,
    `<pre class="code" data-lang="plain">${esc(sel || "// code")}\n</pre><p><br></p>`);
  /* a block at the very top (or glued to another block) leaves no line to move the caret above it */
  const pre = [...editor.querySelectorAll("pre")].find(p => !had.has(p));
  if(pre && pre.parentNode === editor){
    const prev = pre.previousElementSibling;
    if(!prev || /^(PRE|TABLE|HR)$/.test(prev.tagName)){
      const p = document.createElement("p");
      p.innerHTML = "<br>";
      pre.before(p);
    }
  }
  raw = editor.innerHTML; commit();
};
/* embed an image Blob/File as <img src="data:image/…"> at the caret; resolves once it is in the page */
function insertImage(blob){
  return new Promise(res => {
    const fr = new FileReader();

  h.innerHTML = `<select title="Code language">${LANG_OPTS}</select><span class="grow"></span>` +
                `<button class="fmt" title="Re-indent the code for its language">Format</button>` +
                `<button class="x" title="Delete this code block">${TRASH}</button>`;
  h.querySelector("select").onchange = e => {
    if(!h._pre) return;
    h._pre.dataset.lang = e.target.value;
    raw = editor.innerHTML; commit();
  };
  h.querySelector(".fmt").onmousedown = e => e.preventDefault();   // keep the editor focused
  h.querySelector(".fmt").onclick = () => {
    const pre = h._pre; if(!pre) return;
    const def = LANGS[pre.dataset.lang] || LANGS.plain;
    const was = preText(pre);
    let out;
    try{ out = def.fmt(was).replace(/\s+$/, "") + "\n"; }
    catch(e){ toast("Can't format: " + e.message); return; }
    if(out === was){ toast("Already formatted"); return; }
    pre.textContent = out;
    raw = editor.innerHTML; commit();
    editor.focus(); caretTo(pre);
  };
  h.querySelector(".x").onclick = async () => {
    if(!h._pre) return;
    const ok = await confirmBox("Delete code block?", "The code inside it will be removed from this page.", "Delete");
    if(!ok || !h._pre) return;
    h._pre.remove();
    raw = editor.innerHTML; commit(); syncBlocks(); editor.focus();
  };
  return h;
}
let syncQueued = false;
function scheduleSync(){
  if(syncQueued) return;
  syncQueued = true;
  requestAnimationFrame(() => { syncQueued = false; syncBlocks(); });
}
function syncBlocks(){
  if(mode !== "edit"){ layer.innerHTML = ""; syncTable(); return; }
  const pres = [...editor.querySelectorAll("pre.code")];
  while(layer.children.length > pres.length) layer.lastChild.remove();
  while(layer.children.length < pres.length) layer.appendChild(makeHead());
  const base = $("page").getBoundingClientRect();
  pres.forEach((pre, i) => {
    if(!LANGS[pre.dataset.lang]) pre.dataset.lang = "plain";
    const h = layer.children[i], r = pre.getBoundingClientRect();
    h._pre = pre;
    h.style.left  = (r.left - base.left + 2) + "px";
    h.style.top   = (r.top  - base.top  + 1) + "px";
    h.style.width = (r.width - 3) + "px";
    const sel = h.querySelector("select");
    if(document.activeElement !== sel) sel.value = pre.dataset.lang;
  });
  syncTable();
}

/* ═══════════════════════════ table tools ═══════════════════════════ */
/* a bar with row/column buttons floats above the table the caret is in.
   Cells are addressed by position (cellIndex) — colspan/rowspan are not expanded. */
const tbl = $("tbl");
function currentCell(){
  const s = getSelection();
  if(!s.rangeCount) return null;
  let n = s.getRangeAt(0).startContainer;
  n = n.nodeType === 3 ? n.parentNode : n;
  const cell = n && n.closest ? n.closest("td,th") : null;
  return cell && editor.contains(cell) ? cell : null;
}
function blankCell(tag){ const c = document.createElement(tag); c.innerHTML = "<br>"; return c; }
/* every op takes the current cell, mutates the table and returns the cell to put the caret in */
/* a header is a <thead> row, or a first row made of <th> */
function isHeader(tr){ return tr.parentNode.tagName === "THEAD" || (tr.rowIndex === 0 && !!tr.cells[0] && tr.cells[0].tagName === "TH"); }
/* rows are never added to the header: from a header cell the new row becomes the first body row */
function addRow(cell, below){
  const tr = cell.parentNode, table = tr.closest("table"), header = isHeader(tr);
  const nr = document.createElement("tr");
  [...tr.cells].forEach(c => nr.appendChild(blankCell(header ? "td" : c.tagName)));
  if(!header) tr.parentNode.insertBefore(nr, below ? tr.nextSibling : tr);
  else{
    const first = [...table.rows].find(r => !isHeader(r));
    if(first) first.parentNode.insertBefore(nr, first);
    else (table.tBodies[0] || table.appendChild(document.createElement("tbody"))).appendChild(nr);
  }
  return nr.cells[cell.cellIndex];
}
function addCol(cell, after){
  const i = cell.cellIndex;
  let focus = null;
  [...cell.closest("table").rows].forEach(row => {
    const ref = row.cells[i], c = blankCell((ref || row.cells[row.cells.length - 1] || cell).tagName);
    if(ref) ref.parentNode.insertBefore(c, after ? ref.nextSibling : ref); else row.appendChild(c);
    if(row === cell.parentNode) focus = c;
  });
  return focus;
}
function removeTable(table){
  const p = document.createElement("p"); p.innerHTML = "<br>";
  table.replaceWith(p);
  return p;
}
/* swap the row with its neighbour; the header never moves and nothing moves above it */
function moveRow(cell, down){
  const tr = cell.parentNode;
  if(isHeader(tr)){ toast("The header row stays on top"); return cell; }
  const other = down ? tr.nextElementSibling : tr.previousElementSibling;
  if(!other || other.tagName !== "TR" || isHeader(other)){ toast(down ? "No row below to swap with" : "No row above to swap with"); return cell; }
  if(down) tr.before(other); else tr.after(other);
  return cell;
}
/* swap the column with its neighbour in every row; rows too short to have both cells are left alone */
function moveCol(cell, right){
  const i = cell.cellIndex, j = right ? i + 1 : i - 1;
  if(j < 0 || j >= cell.parentNode.cells.length){ toast(right ? "No column to the right to swap with" : "No column to the left to swap with"); return cell; }
  [...cell.closest("table").rows].forEach(row => {
    const a = row.cells[Math.min(i, j)], b = row.cells[Math.max(i, j)];
    if(a && b) a.before(b);
  });
  return cell;
}
const TABLE_OPS = {
  rowAbove: cell => addRow(cell, false),
  rowBelow: cell => addRow(cell, true),
  rowUp:    cell => moveRow(cell, false),
  rowDown:  cell => moveRow(cell, true),
  colLeft:  cell => addCol(cell, false),
  colRight: cell => addCol(cell, true),
  colPrev:  cell => moveCol(cell, false),
  colNext:  cell => moveCol(cell, true),
  delRow(cell){
    let tr = cell.parentNode; const table = tr.closest("table");
    if(isHeader(tr)){                          // the header stays; remove the first body row instead
      tr = [...table.rows].find(r => !isHeader(r));
      if(!tr){ toast("The header row stays — delete the table to remove it"); return cell; }
    }
    if(table.rows.length <= 1) return removeTable(table);
    const i = tr.rowIndex; tr.remove();
    const row = table.rows[Math.min(i, table.rows.length - 1)];
    return row.cells[Math.min(cell.cellIndex, row.cells.length - 1)];
  },
  delCol(cell){
    const tr = cell.parentNode, table = tr.closest("table"), i = cell.cellIndex;
    if(tr.cells.length <= 1) return removeTable(table);
    [...table.rows].forEach(row => row.cells[i] && row.cells[i].remove());
    return tr.cells[Math.min(i, tr.cells.length - 1)];
  },
  delTable: cell => removeTable(cell.closest("table"))
};
tbl.querySelectorAll("button").forEach(b => {
  b.onmousedown = e => e.preventDefault();
  b.onclick = async () => {
    const cell = tbl._cell;
    if(!cell || !cell.isConnected) return;
    if(b.dataset.t === "delTable"){
      const ok = await confirmBox("Delete table?", "Everything in it will be removed from this page.", "Delete");
      if(!ok || !cell.isConnected) return;
    }
    const focus = TABLE_OPS[b.dataset.t](cell);
    editor.focus(); caretTo(focus, false);
    raw = editor.innerHTML; commit(); syncBlocks();
  };
});
function syncTable(){
  const cell = mode === "edit" ? currentCell() : null;
  tbl._cell = cell;
  tbl.style.display = cell ? "" : "none";
  if(!cell) return;
  const base = $("page").getBoundingClientRect(), r = cell.closest("table").getBoundingClientRect();
  tbl.style.left = (r.left - base.left) + "px";
  tbl.style.top  = (r.top  - base.top - 36) + "px";
}
document.addEventListener("selectionchange", () => { if(mode === "edit") scheduleSync(); });
editor.addEventListener("click", scheduleSync);
editor.addEventListener("keyup", scheduleSync);

/* ═══════════════════════════ export / import ═══════════════════════════ */
$("btnExport").onclick = async () => {
  if(mode !== "view") commit();
  if(!db.tree.length){ toast("Nothing to export yet"); return; }
  const picked = await pickBox("Export", "Choose which folders and pages to include in the backup.", db.tree, "Export");
  if(!picked) return;
  const tree = prune(db.tree, picked);
  let count = 0; each(n => { if(n.type === "page") count++; }, tree);
  const payload = { app:"virtualpc", version:1, exportedAt:new Date().toISOString(), tree };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "virtualpc-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Exported " + count + " page" + (count !== 1 ? "s" : ""));
};
$("btnImport").onclick = () => $("file").click();
$("file").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(err){ toast("That file isn't valid JSON"); return; }
  const tree = Array.isArray(data) ? data : data && data.tree;
  if(!Array.isArray(tree)){ toast("No Virtual PC data found in that file"); return; }
  const all = normalize(tree);
  if(!all.length){ toast("That backup is empty"); return; }
  const picked = await pickBox("Import", "Choose which folders and pages to bring in from " + file.name + ".", all, "Import");
  if(!picked) return;
  const nodes = prune(all, picked);
  let count = 0; each(() => count++, nodes);
  const choice = await choiceBox("Import " + count + " item" + (count > 1 ? "s" : ""),
    "Replace everything currently stored, or add the imported items alongside it?",
    [["Merge","merge"],["Replace","replace"]]);
  if(!choice) return;
  if(choice === "replace"){ db.tree = nodes; db.selected = null; }
  else db.tree = db.tree.concat(nodes);
  save(); renderTree(); render();
  toast(choice === "replace" ? "Library replaced" : "Items merged in");
};
/* deep-copy `nodes`, keeping pages whose id is in `keep` and folders that are
   kept themselves or hold something that is */
function prune(nodes, keep){
  const out = [];
  for(const n of nodes){
    if(n.type === "folder"){
      const children = prune(n.children || [], keep);
      if(keep.has(n.id) || children.length) out.push({ ...n, children });
    }else if(keep.has(n.id)) out.push({ ...n });
  }
  return out;
}
function normalize(arr){
  const out = [];
  for(const n of arr || []){
    if(!n || typeof n !== "object") continue;
    const type = n.type === "folder" || Array.isArray(n.children) ? "folder" : "page";
    const node = { id:uid(), type, name:String(n.name || (type === "folder" ? "Folder" : "Untitled page")).slice(0, 200) };
    if(type === "folder"){
      node.open = n.open !== false;
      if(isFolderIcon(n.icon)) node.icon = n.icon;
      node.children = normalize(n.children);
    }
    else node.content = clean(String(n.content || ""));
    out.push(node);
  }
  return out;
}

/* ═══════════════════════════ dialogs ═══════════════════════════ */
function openDialog(html, focusSel){
  dialog.innerHTML = html; veil.classList.add("open");
  const f = focusSel && dialog.querySelector(focusSel);
  if(f){ f.focus(); f.select && f.select(); }
}
function closeDialog(){ veil.classList.remove("open"); dialog.classList.remove("wide"); dialog.innerHTML = ""; }
/* `extra` is trusted, already-escaped markup shown between the message and the buttons */
function confirmBox(title, msg, label = "OK", extra = ""){
  return new Promise(res => {
    openDialog(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>${extra}<div class="acts">
      <button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn ${label === "Delete" ? "danger" : "primary"}" data-a="1">${esc(label)}</button></div>`);
    dialog.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { closeDialog(); res(b.dataset.a === "1"); });
    dialog.querySelector('[data-a="1"]').focus();
    veil._esc = () => { closeDialog(); res(false); };
  });
}
function promptBox(title, label, value = ""){
  return new Promise(res => {
    openDialog(`<h3>${esc(title)}</h3><p>${esc(label)}</p><input value="${attr(value)}">
      <div class="acts"><button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn primary" data-a="1">Add</button></div>`, "input");
    const input = dialog.querySelector("input");
    const done = ok => { const v = input.value.trim(); closeDialog(); res(ok ? v : null); };
    dialog.querySelector('[data-a="1"]').onclick = () => done(true);
    dialog.querySelector('[data-a="0"]').onclick = () => done(false);
    input.onkeydown = e => { if(e.key === "Enter") done(true); };
    veil._esc = () => done(false);
  });
}
function linkBox(name = ""){
  return new Promise(res => {
    openDialog(`<h3>Add link</h3><p>Name</p><input id="lkName" value="${attr(name)}" placeholder="Link text">
      <p>Address</p><input id="lkUrl" value="https://">
      <div class="acts"><button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn primary" data-a="1">Add</button></div>`, name ? "#lkUrl" : "#lkName");
    const nameIn = dialog.querySelector("#lkName"), urlIn = dialog.querySelector("#lkUrl");
    const done = ok => {
      const url = urlIn.value.trim(); closeDialog();
      res(ok && url && url !== "https://" ? { url, name:nameIn.value.trim() } : null);   // untouched placeholder = no link
    };
    dialog.querySelector('[data-a="1"]').onclick = () => done(true);
    dialog.querySelector('[data-a="0"]').onclick = () => done(false);
    nameIn.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); urlIn.focus(); urlIn.select(); } };
    urlIn.onkeydown = e => { if(e.key === "Enter") done(true); };
    veil._esc = () => done(false);
  });
}
function choiceBox(title, msg, choices){
  return new Promise(res => {
    const btns = choices.map((c, i) =>
      `<button class="btn ${i === choices.length-1 ? "primary" : ""}" data-v="${c[1]}">${esc(c[0])}</button>`).join("");
    openDialog(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="acts">
      <button class="btn ghost" data-v="">Cancel</button>${btns}</div>`);
    dialog.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { closeDialog(); res(b.dataset.v || null); });
    veil._esc = () => { closeDialog(); res(null); };
  });
}
/* tree of checkboxes; resolves with a Set of chosen ids, or null on cancel */
function pickBox(title, msg, nodes, label){
  return new Promise(res => {
    let rows = "";
    each((n, depth) => {
      rows += `<label class="pick-row" style="padding-left:${6 + depth * 18}px">
        <input type="checkbox" data-id="${n.id}" data-type="${n.type}" checked>
        <span class="gl">${glyph(n)}</span><span class="label">${esc(n.name)}</span></label>`;
    }, nodes);
    dialog.classList.add("wide");
    openDialog(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="pick-head"><span id="pickCount"></span><span>
        <button class="btn ghost" data-sel="1">Select all</button>
        <button class="btn ghost" data-sel="0">Select none</button></span></div>
      <div class="pick-tree">${rows}</div>
      <div class="acts"><button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn primary" data-a="1">${esc(label)}</button></div>`);
    const boxes = [...dialog.querySelectorAll(".pick-tree input")];
    const byId = new Map(boxes.map(b => [b.dataset.id, b]));
    const ok = dialog.querySelector('[data-a="1"]'), count = dialog.querySelector("#pickCount");
    const boxOf = n => byId.get(n.id);
    /* folders reflect their descendants: all → checked, some → indeterminate */
    function refresh(list = nodes){
      let checked = 0, total = 0;
      for(const n of list){
        const b = boxOf(n);
        if(n.type === "folder" && n.children && n.children.length){
          const [c, t] = refresh(n.children);
          b.checked = c === t; b.indeterminate = c > 0 && c < t;
          checked += c; total += t;
        }else{
          b.indeterminate = false;
          if(b.checked) checked++; total++;
        }
      }
      if(list === nodes){
        count.textContent = checked + " of " + total + " selected";
        ok.disabled = !checked;
      }
      return [checked, total];
    }
    const setAll = (list, v) => each(n => { boxOf(n).checked = v; }, list);
    boxes.forEach(b => b.onchange = () => {
      const n = find(b.dataset.id, nodes);
      if(n && n.node.type === "folder") setAll(n.node.children || [], b.checked);
      refresh();
    });
    dialog.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => { setAll(nodes, b.dataset.sel === "1"); refresh(); });
    refresh();
    const done = go => {
      const set = new Set(boxes.filter(b => b.checked || b.indeterminate).map(b => b.dataset.id));
      closeDialog(); res(go && set.size ? set : null);
    };
    ok.onclick = () => done(true);
    dialog.querySelector('[data-a="0"]').onclick = () => done(false);
    veil._esc = () => done(false);
    ok.focus();
  });
}
